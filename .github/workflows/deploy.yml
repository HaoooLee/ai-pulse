name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
      - name: Check deployment configuration
        run: |
          test -n "$VERCEL_ORG_ID" && test -n "$VERCEL_PROJECT_ID" && test -n "$VERCEL_TOKEN"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check && pnpm test
      - name: Load Vercel production settings
        run: pnpm dlx vercel@48.0.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build production deployment
        run: pnpm dlx vercel@48.0.0 build --prod --token="$VERCEL_TOKEN"
      - name: Deploy built application
        run: pnpm dlx vercel@48.0.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
